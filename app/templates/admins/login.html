<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-2xl shadow-lg">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">Pajina Login</h1>
            <p class="mt-2 text-sm text-gray-600">Login hodi tuir sesaun sistema nian</p>
        </div>

        <div id="form-messages" class="text-center text-sm font-medium text-red-600"></div>
        {% if messages %}
            {% for message in messages %}
            {% if message.tags == "success" %}
                <div class="mb-4 text-green-600 font-medium">{{ message }}</div>
            {% elif message.tags == "error" %}
                <div class="mb-4 text-red-600 font-medium">{{ message }}</div>
            {% else %}
                <div class="mb-4 text-gray-700 font-medium">{{ message }}</div>
            {% endif %}
            {% endfor %}
        {% endif %}
        <form 
            method="post"
            hx-target="#form-messages" 
            hx-swap="innerHTML"
            hx-indicator="#loading"
            class="mt-8 space-y-6"
        >
            {% csrf_token %}
            
            <div class="relative">
                <label for="username" class="sr-only">Username</label>
                <input 
                    id="username" 
                    name="username" 
                    type="text" 
                    autocomplete="off" 
                    required 
                    class="w-full px-4 py-3 text-gray-700 bg-gray-100 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 focus:outline-none" 
                    placeholder="Username"
                >
            </div>

            <div class="relative">
                <label for="password" class="sr-only">Password</label>
                <input 
                    id="password" 
                    name="password" 
                    type="password" 
                    autocomplete="off" 
                    required 
                    class="w-full px-4 py-3 text-gray-700 bg-gray-100 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 focus:outline-none" 
                    placeholder="Password"
                >
            </div>

            <div>
                <button 
                    type="submit" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out"
                >
                    <span class="htmx-indicator" id="loading">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                    Login
                </button>
            </div>
        </form>
    </div>
</body>
</html>
